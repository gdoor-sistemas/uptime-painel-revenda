# Change these first
owner: gdoor-sistemas # Your GitHub organization or username, where this repository lives
repo: uptime-painel-revenda # The name of this repository

sites:
  - name: Painel da Revenda
    url: https://painel.gdoor.com.br
    icon: https://gdoor-sistemas.github.io/uptime-painel-revenda/gdoor-icon.svg
  - name: Login da Revenda
    url: https://painel.gdoor.com.br/rev/login
    icon: https://gdoor-sistemas.github.io/uptime-painel-revenda/gdoor-icon.svg

status-website:
  # GitHub Pages project site path
  baseUrl: /uptime-painel-revenda
  logoUrl: https://gdoor-sistemas.github.io/uptime-painel-revenda/gdoor-zucchetti.png
  favicon: https://gdoor-sistemas.github.io/uptime-painel-revenda/favicon.png
  name: Status
  introTitle: "Status do Painel da Revenda"
  introMessage: Disponibilidade e tempo de resposta do [Painel da Revenda](https://painel.gdoor.com.br), verificados a cada 5 minutos.
  navbar:
    - title: Status
      href: /uptime-painel-revenda
    - title: Acessar o painel →
      href: https://painel.gdoor.com.br/rev/login
  scripts:
    - src: https://gdoor-sistemas.github.io/uptime-painel-revenda/status-bars.js
  # Design Pattern "Clareza" (Interno_Web_Design_Pattern/tokens/tokens.css)
  css: |
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
    :root {
      --g-font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --g-font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      --g-bg: #F7F7F5; --g-surface: #FFFFFF; --g-surface-muted: #FBFAF8; --g-hover: #F1F0EC;
      --g-border: #E7E5E0; --g-border-strong: #DEDBD4;
      --g-text: #1C1B19; --g-text-2: #45433F; --g-text-muted: #6B6862; --g-text-on-primary: #FFFFFF;
      --g-primary: #C2410C; --g-primary-hover: #9A3412; --g-primary-soft: #FDEEE4; --g-primary-text: #B4410C;
      --g-focus-ring: 0 0 0 3px rgba(194, 65, 12, 0.28);
      --g-ok-bg: #E6F4EA; --g-ok-fg: #1E6B34;
      --g-danger-bg: #FCE8E6; --g-danger-fg: #A8261B;
      --g-warn-bg: #FFF3D6; --g-warn-fg: #7A5300;
      --g-neutral-bg: #EFEEEA; --g-neutral-fg: #4A4843;
      --g-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --g-bar-ok: #2E9E5B; --g-bar-warn: #E0A800; --g-bar-danger: #D93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --g-bg: #111110; --g-surface: #1A1918; --g-surface-muted: #201F1D; --g-hover: #262523;
        --g-border: #2E2C29; --g-border-strong: #3A3835;
        --g-text: #EDECE9; --g-text-2: #C9C7C2; --g-text-muted: #9C9992; --g-text-on-primary: #1C0E04;
        --g-primary: #F97316; --g-primary-hover: #FB923C; --g-primary-soft: #2D1A0E; --g-primary-text: #FB923C;
        --g-focus-ring: 0 0 0 3px rgba(249, 115, 22, 0.35);
        --g-ok-bg: #12291A; --g-ok-fg: #6FD394;
        --g-danger-bg: #351513; --g-danger-fg: #FF8F84;
        --g-warn-bg: #33270A; --g-warn-fg: #F2C14E;
        --g-neutral-bg: #262523; --g-neutral-fg: #C9C7C2;
        --g-bar-ok: #6FD394; --g-bar-warn: #F2C14E; --g-bar-danger: #FF8F84;
      }
      nav .logo img { filter: brightness(0) invert(1); }
    }
    :root {
      --body-background-color: var(--g-bg);
      --body-text-color: var(--g-text);
      --card-background-color: var(--g-surface);
      --card-border-color: var(--g-border);
      --nav-background-color: var(--g-surface);
      --nav-border-bottom-color: var(--g-border);
      --nav-current-border-bottom-color: transparent;
      --up-border-left-color: var(--g-border);
      --down-border-left-color: var(--g-danger-fg);
      --down-background-color: var(--g-danger-bg);
      --degraded-border-left-color: var(--g-warn-fg);
      --tag-color: var(--g-text-on-primary);
      --tag-up-background-color: var(--g-ok-fg);
      --tag-down-background-color: var(--g-danger-fg);
      --tag-degraded-background-color: var(--g-warn-fg);
      --change-background-color: var(--g-warn-bg);
      --error-button-border-color: var(--g-primary);
      --error-button-background-color: var(--g-primary);
      --error-button-color: var(--g-text-on-primary);
      --submit-button-border-color: var(--g-primary);
      --submit-button-background-color: var(--g-primary);
      --submit-button-color: var(--g-text-on-primary);
    }

    body { font: 400 14px/20px var(--g-font-sans); padding-bottom: 0; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1024px; padding: 0 32px; }
    a { color: var(--g-primary-text); }
    a:focus-visible, label:focus-visible { outline: none; box-shadow: var(--g-focus-ring); border-radius: 8px; }
    h1, h2, h3, h4 { letter-spacing: 0; }
    h2 { font: 600 15px/22px var(--g-font-sans); margin: 0; }
    h3 { opacity: 1; color: var(--g-text-muted); font: 600 12px/16px var(--g-font-sans); text-transform: uppercase; letter-spacing: 0.04em; }

    nav { position: sticky; top: 0; z-index: 10; margin-bottom: 0 !important; padding: 0 !important; font-weight: 500 !important; background: var(--g-surface) !important; }
    nav .container { display: flex !important; align-items: center !important; justify-content: space-between !important; height: 64px; }
    nav .logo { display: flex !important; align-items: center !important; gap: 12px; padding: 0 !important; color: var(--g-text-2) !important; font: 600 15px/22px var(--g-font-sans); text-decoration: none; }
    nav .logo img { height: 36px !important; width: auto !important; margin: 0 !important; }
    nav .logo div { padding-left: 12px; border-left: 1px solid var(--g-border); }
    nav ul { gap: 8px; }
    nav ul a { display: flex !important; align-items: center; height: 40px; padding: 0 16px !important; border-radius: 8px; color: var(--g-text-2) !important; font: 500 14px/20px var(--g-font-sans); border: 0 !important; transition: background 120ms var(--g-ease), color 120ms var(--g-ease); }
    nav ul a:hover { background: var(--g-hover); color: var(--g-text) !important; }
    nav ul a[aria-current] { background: var(--g-primary-soft); color: var(--g-primary-text) !important; }
    nav ul li:last-child a { background: var(--g-primary); color: var(--g-text-on-primary) !important; font-weight: 600; }
    nav ul li:last-child a:hover { background: var(--g-primary-hover); }

    main.container { padding-top: 32px; }
    main.container > header { margin: 0 0 24px !important; padding: 0; text-align: left; }
    main.container > header h1 { margin: 0 0 4px; font: 700 28px/34px var(--g-font-sans); letter-spacing: -0.02em; color: var(--g-text); }
    main.container > header h1 strong { font-weight: 700; }
    main.container > header .lead { margin: 0 !important; font: 400 14px/20px var(--g-font-sans) !important; color: var(--g-text-muted); }

    article { border: 1px solid var(--g-border) !important; border-radius: 12px; padding: 20px; box-shadow: none; }
    article + article { margin-top: 12px; }
    main.container > article { display: flex; align-items: center; gap: 8px; padding: 16px 20px; font: 600 14px/20px var(--g-font-sans); }
    main.container > article.up { background: var(--g-ok-bg); border-color: transparent !important; color: var(--g-ok-fg); }
    main.container > article.down { background: var(--g-danger-bg); border-color: transparent !important; color: var(--g-danger-fg); }
    main.container > article.degraded { background: var(--g-warn-bg); border-color: transparent !important; color: var(--g-warn-fg); }

    main .f { margin-top: 24px; margin-bottom: 12px; gap: 12px; }
    form.r { border: 1px solid var(--g-border); background: var(--g-surface); border-radius: 8px; padding: 3px; gap: 2px; }
    form.r label { display: flex; align-items: center; height: 28px; margin: 0 !important; padding: 0 12px; border-radius: 6px; font: 500 13px/18px var(--g-font-sans); color: var(--g-text-muted); cursor: pointer; transition: background 120ms var(--g-ease), color 120ms var(--g-ease); }
    form.r label:hover { background: var(--g-hover); color: var(--g-text); }
    form.r input:checked + label { background: var(--g-primary-soft); color: var(--g-primary-text); font-weight: 600 !important; }

    section.live-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    section.live-status article { display: flex; flex-direction: column; gap: 8px; margin: 0 !important; padding: 20px; overflow: hidden; background-image: none !important; transition: border-color 120ms var(--g-ease); }
    section.live-status article:hover { border-color: var(--g-border-strong) !important; }
    section.live-status .g-bars { position: relative; z-index: 1; margin-top: 12px; }
    section.live-status .g-bars__track { display: flex; gap: 3px; height: 32px; }
    section.live-status .g-bar { flex: 1; border-radius: 3px; transition: opacity 120ms var(--g-ease); }
    section.live-status .g-bar:hover { opacity: 0.7; }
    section.live-status .g-bar--ok { background: var(--g-bar-ok); }
    section.live-status .g-bar--warn { background: var(--g-bar-warn); }
    section.live-status .g-bar--danger { background: var(--g-bar-danger); }
    section.live-status .g-bar--empty { background: var(--g-neutral-bg); }
    section.live-status .g-bars__axis { display: flex; justify-content: space-between; margin-top: 6px; font: 500 12px/16px var(--g-font-sans); color: var(--g-text-muted); }
    section.live-status h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font: 600 15px/22px var(--g-font-sans); }
    section.live-status h4 a { color: var(--g-text) !important; }
    section.live-status h4 .icon { flex: none; width: auto !important; height: 18px !important; aspect-ratio: auto; object-fit: contain; margin: 0 !important; transform: none !important; }
    section.live-status h4::after { display: inline-flex; align-items: center; height: 24px; margin-left: auto; padding: 0 10px; border-radius: 999px; font: 600 12px/1 var(--g-font-sans); white-space: nowrap; }
    section.live-status article.up h4::after { content: '● Operacional'; background: var(--g-ok-bg); color: var(--g-ok-fg); }
    section.live-status article.down h4::after { content: '● Fora do ar'; background: var(--g-danger-bg); color: var(--g-danger-fg); }
    section.live-status article.degraded h4::after { content: '● Degradado'; background: var(--g-warn-bg); color: var(--g-warn-fg); }
    section.live-status article > div { display: flex; flex-direction: column; gap: 2px; font: 500 13px/18px var(--g-font-sans); color: var(--g-text-muted); }
    section.live-status .data { padding: 0 !important; color: var(--g-text); font-variant-numeric: tabular-nums; }
    section.live-status article > div:nth-of-type(1) .data { font: 700 28px/34px var(--g-font-sans); letter-spacing: -0.02em; }
    section.live-status article > div:nth-of-type(2) .data { font: 500 13px/18px var(--g-font-mono); }

    article.down, article.degraded { border-left-width: 1px !important; }
    .tag { border-radius: 999px; font: 600 12px/1 var(--g-font-sans); padding: 6px 10px; }
    .submit-button, a.error-button { border-radius: 8px; }
    .submit-button:hover, a.error-button:hover { background: var(--g-primary-hover); }
    footer { margin-top: 48px; padding: 20px 0 24px; border-top: 1px solid var(--g-border); color: var(--g-text-muted); font: 400 13px/18px var(--g-font-sans); }
    footer a { color: var(--g-text-2) !important; }
    @media (max-width: 959px) {
      .container { padding: 0 16px; }
      main.container { padding-top: 24px; }
    }
    @media (max-width: 600px) {
      nav .logo div { display: none; }
      nav ul li:first-child { display: none; }
      nav .logo img { height: 30px !important; }
    }

